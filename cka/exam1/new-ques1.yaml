---
apiVersion: v1
kind: Pod
metadata:
  name: mc-pod
  namespace: mc-namespace
spec:
  containers:
    - name: mc-pod-1
      image: nginx:1-alpine
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      volumeMounts:
        - mountPath: /var/log/shared
          name: shared-volume

    - name: mc-pod-2
      image: busybox:1
      command: ["sh", "-c", "while true; do date '+%Y-%m-%d %H:%M:%S' >> /var/log/shared/date.log; sleep 1; done"]
      volumeMounts:
        - mountPath: /var/log/shared
          name: shared-volume

    - name: mc-pod-3
      image: busybox:1
      command: ["sh", "-c", "tail -f /var/log/shared/date.log"]
      volumeMounts:
        - mountPath: /var/log/shared
          name: shared-volume

  volumes:
    - name: shared-volume
      emptyDir: {}
